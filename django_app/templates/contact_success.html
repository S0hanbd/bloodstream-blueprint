{% extends 'base.html' %}

{% block title %}Contact Granted - UAP Bloodstream{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white dark:bg-slate-900 border border-emerald-200 dark:border-emerald-900 rounded-3xl shadow-xl p-6 sm:p-8 text-center space-y-6">
        
        <div class="w-16 h-16 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-600 mx-auto flex items-center justify-center font-bold text-2xl">
            ✓
        </div>

        <div class="space-y-1">
            <h1 class="font-heading text-2xl font-extrabold text-slate-900 dark:text-white">
                Contact Request Sent
            </h1>
            <p class="text-xs text-slate-500">
                You are authorized to contact donor <strong>{{ donor.full_name }}</strong>.
            </p>
        </div>

        <div class="p-6 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-900 space-y-2">
            <div class="text-xs text-slate-500 uppercase tracking-wider font-bold">Donor Phone Number:</div>
            <a href="tel:{{ donor.phone }}" class="text-2xl font-extrabold font-mono text-emerald-700 dark:text-emerald-300 block hover:underline">
                {{ donor.phone }}
            </a>
        </div>

        <a href="tel:{{ donor.phone }}" class="block w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md transition">
            Call Donor Directly
        </a>

        <a href="{% url 'search' %}" class="block text-xs font-semibold text-slate-400 hover:text-slate-600">
            &larr; Back to Donor Search
        </a>
    </div>
</div>
{% endblock %}
