{% extends 'base.html' %}

{% block title %}Forgot Password - UAP Bloodstream{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xl p-6 sm:p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-blue-100 dark:bg-blue-950 text-blue-600 mx-auto flex items-center justify-center font-bold">
                🔑
            </div>
            <h1 class="font-heading text-2xl font-extrabold text-slate-900 dark:text-white">
                Account Recovery
            </h1>
            <p class="text-xs text-slate-500">
                Enter your registered email address to receive password reset instructions.
            </p>
        </div>

        <form method="POST" action="{% url 'forgot_password' %}" class="space-y-4">
            {% csrf_token %}

            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">Registered Email Address</label>
                <input type="email" name="email" required placeholder="student@uap-bd.edu" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md transition">
                Send Password Reset Link
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 border-t border-slate-100 dark:border-slate-800 pt-4">
            Remembered password? 
            <a href="{% url 'login' %}" class="font-bold text-red-600 hover:underline">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
